
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101a32">
<title>AV & Marketing Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f4f6fa;
  --surface:#ffffff;
  --navy:#101a32;
  --navy2:#182746;
  --blue:#3159a5;
  --cyan:#28a9bd;
  --text:#172238;
  --muted:#778196;
  --line:#e5e9f0;
  --green:#16866a;
  --radius:17px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Vazirmatn,sans-serif;line-height:1.85
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}

/* LOGIN */
#login{
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;
  background:radial-gradient(circle at 15% 15%,#244a82,#101a32 65%);
}
.login-box{
  width:100%;max-width:390px;background:white;
  padding:35px;border-radius:24px;text-align:center;
  box-shadow:0 25px 80px #0005
}
.logo{
  width:65px;height:65px;border-radius:19px;
  display:grid;place-items:center;margin:auto auto 18px;
  background:linear-gradient(135deg,#3159a5,#28a9bd);
  color:white;font-weight:800;font-size:21px
}
.login-box h1{font-size:23px;margin:0}
.login-box p{color:var(--muted);font-size:13px}
.login-box input{
  width:100%;padding:13px;margin:8px 0;
  border:1px solid var(--line);border-radius:11px;
  outline:none;background:#fafbfe
}
.login-box input:focus{border-color:var(--blue)}
.primary{
  width:100%;border:0;border-radius:11px;padding:13px;
  background:var(--blue);color:white;font-weight:700;margin-top:12px
}
.error{color:#bd4545;font-size:13px;min-height:24px}

/* APP */
#app{min-height:100vh}
.topbar{
  height:66px;background:var(--navy);color:white;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 25px;position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800}
.brand-icon{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#3159a5,#28a9bd);
  display:grid;place-items:center;font-size:12px
}
.top-actions{display:flex;align-items:center;gap:15px}
.top-actions button{
  color:white;background:#ffffff16;border:1px solid #ffffff22;
  border-radius:9px;padding:7px 12px;font-size:12px
}
.layout{display:flex;min-height:calc(100vh - 66px)}
.sidebar{
  width:255px;background:var(--navy2);color:white;
  padding:22px 14px;flex-shrink:0
}
.side-label{
  color:#8295b5;font-size:11px;font-weight:700;
  padding:17px 12px 7px
}
.nav-item{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:11px 13px;border:0;border-radius:10px;
  background:transparent;color:#d4dced;text-align:right;
  font-size:13px;margin:3px 0
}
.nav-item:hover,.nav-item.active{background:#ffffff17;color:white}
.nav-icon{width:22px;text-align:center;font-size:17px}
.content{flex:1;min-width:0;padding:28px 34px 70px}
.mobile-menu{display:none}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:15px}
.page-title{font-size:27px;font-weight:800;margin:0 0 6px}
.page-subtitle{font-size:13px;color:var(--muted);margin:0 0 25px}
.hero{
  background:linear-gradient(115deg,#14264b,#3159a5 70%,#238caa);
  color:white;padding:30px;border-radius:22px;
  position:relative;overflow:hidden;margin-bottom:25px
}
.hero:after{
  content:"AV";position:absolute;left:25px;top:-50px;
  font-size:170px;font-weight:800;color:#ffffff0b
}
.hero h2{font-size:24px;margin:0 0 8px;position:relative;z-index:1}
.hero p{font-size:13px;color:#d9e6fa;max-width:650px;position:relative;z-index:1}
.hero-tag{font-size:11px;background:#ffffff20;padding:5px 11px;border-radius:20px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  margin:20px 0 28px
}
.stat,.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:19px
}
.stat strong{font-size:25px;color:var(--blue);display:block}
.stat span{font-size:12px;color:var(--muted)}
.section-title{font-size:17px;font-weight:800;margin:30px 0 14px}
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px
}
.card{transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #1b315010}
.card-icon{
  width:43px;height:43px;border-radius:13px;
  display:grid;place-items:center;font-size:21px;
  background:#edf2fc;margin-bottom:12px
}
.card h3{font-size:15px;margin:0 0 6px}
.card p{font-size:12px;color:var(--muted);margin:0 0 12px}
.card-foot{
  display:flex;justify-content:space-between;
  align-items:center;font-size:11px;color:var(--muted)
}
.pill{
  background:#edf3ff;color:#3159a5;
  padding:3px 9px;border-radius:20px;font-size:10px
}
.search-wrap{margin:20px 0}
.search{
  width:100%;padding:13px 17px;border:1px solid var(--line);
  border-radius:12px;background:white;outline:none
}
.search:focus{border-color:var(--blue)}
.lesson{
  background:white;border:1px solid var(--line);
  border-radius:18px;padding:26px;max-width:900px
}
.lesson h2{font-size:22px;margin-top:0}
.lesson h3{font-size:17px;color:var(--blue);margin-top:25px}
.lesson p,.lesson li{font-size:14px}
.lesson-callout{
  background:#edf5ff;border-right:4px solid var(--cyan);
  padding:14px 17px;border-radius:10px;margin:17px 0
}
.lesson-warning{
  background:#fff7e8;border-right:4px solid #e7b54e;
  padding:14px 17px;border-radius:10px;margin:17px 0
}
.lesson-nav{
  display:flex;gap:10px;margin-top:20px;flex-wrap:wrap
}
.lesson-nav button{
  border:0;background:var(--blue);color:white;
  border-radius:9px;padding:10px 15px
}
.secondary{background:#eaf0fb!important;color:#284b88!important}
.quiz-option{
  display:block;width:100%;text-align:right;padding:12px;
  border:1px solid var(--line);border-radius:10px;
  margin:8px 0;background:white
}
.quiz-option:hover{border-color:var(--blue)}
.footer-note{font-size:11px;color:var(--muted);margin-top:35px}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:900px){
 .sidebar{width:220px}.content{padding:24px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:650px){
 .topbar{padding:0 14px;height:58px}
 .brand{font-size:13px}
 .mobile-menu{display:block}
 .layout{display:block}
 .sidebar{
  display:none;position:fixed;z-index:30;top:58px;
  bottom:0;right:0;width:270px;overflow:auto;
  box-shadow:-20px 0 50px #0003
 }
 .sidebar.open{display:block}
 .content{padding:20px 15px 60px}
 .hero{padding:23px}
 .hero h2{font-size:20px}
 .stats{gap:8px}
 .stat{padding:12px}
 .stat strong{font-size:20px}
 .grid{grid-template-columns:1fr}
 .page-title{font-size:22px}
 .lesson{padding:19px}
}
</style>
</head>

function login(event){
 event.preventDefault();
 const u=document.getElementById("username").value.trim();
 const p=document.getElementById("password").value;
 if(u===DEMO_USER && p===DEMO_PASS){
  sessionStorage.setItem("academyDemo","1");
  openApp();
 }else{

 }
}
document.getElementById("loginForm").addEventListener("submit",login);

}

  window.answerQuiz=(i)=>{
   const buttons=document.querySelectorAll(".quiz-option");
   buttons.forEach(b=>b.disabled=true);
   const ok=i===q.correct;
   if(ok)score++;
   document.getElementById("quizFeedback").innerHTML=
    `<div class="${ok?'lesson-callout':'lesson-warning'}">${ok?'پاسخ درست است.':'این پاسخ درست نیست.'} ${q.explain}</div>
     <button class="primary" onclick="nextQuiz()">ادامه</button>`;
  };
  window.nextQuiz=()=>{
   current++;
   if(current<quiz.length)render();
   else document.getElementById("quizBox").innerHTML=
    `<h2>آزمون به پایان رسید</h2><h1>${score} از ${quiz.length}</h1>
     <p>امتیاز شما</p><button class="primary" onclick="showQuiz()">تکرار آزمون</button>`;
  };
 }
 render();
}
